<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modernized Blog Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="main-header">
            <div class="container">
                <div class="logo-area">
                    <h1><span class="icon">📝</span> Lazarus Blog</h1>
                    <p class="subtitle">Modernized Legacy Platform v2.0</p>
                </div>
            </div>
        </header>

        <main class="container">
            <!-- Create Post Section -->
            <section class="create-post-section">
                <div class="card glass">
                    <h2>Create New Post</h2>
                    <form id="postForm" class="modern-form">
                        <div class="form-group">
                            <label for="title">Post Title</label>
                            <input type="text" id="title" placeholder="Enter a catchy title..." required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="author">Author Name</label>
                                <input type="text" id="author" placeholder="Your name (optional)">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="content">Content</label>
                            <textarea id="content" placeholder="What's on your mind?" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">
                            Publish Post
                        </button>
                    </form>
                </div>
            </section>

            <div class="divider">
                <span>All Posts</span>
            </div>

            <!-- Posts container -->
            <section id="posts" class="posts-section">
                <div id="postsList" class="posts-grid">
                    <!-- Posts injected by app.js -->
                    <div class="loading-spinner">Loading posts...</div>
                </div>
            </section>
        </main>

        <footer class="main-footer">
            <div class="container">
                <p>&copy; 2024 Lazarus Engine Resurrection. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
